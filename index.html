<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tracko Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Firebase config -->
  <script src="firebase-config.js" defer></script>
  <!-- Main logic -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Login Section -->
  <div id="login-section" class="center">
    <h1>Welcome to Tracko</h1>
    <p>Track your time in academic and entertainment modes.</p>
    <button id="login-btn">Sign in with Google</button>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard" class="hidden">
    <div class="dashboard-header">
      <div class="profile-info">
        <h1>👋 Hello, <span id="user-name"></span></h1>
      </div>
      <button id="logout-btn">Logout</button>
    </div>

    <div class="stats-container">
      <div class="stats-box">
        <h2>📘 Academic</h2>
        <p>Time: <span id="academic-data">0</span> mins</p>
        <ul id="academic-list"></ul>
      </div>
      <div class="stats-box">
        <h2>🎮 Entertainment</h2>
        <p>Time: <span id="entertainment-data">0</span> mins</p>
        <ul id="entertainment-list"></ul>
      </div>
    </div>

    <div class="coming-soon-section">
      <h2>📺 Video History (Coming Soon)</h2>
      <div class="coming-soon-boxes">
        <div class="coming-box">
          <h3>📘 Academic Videos</h3>
          <p>Coming Soon...</p>
        </div>
        <div class="coming-box">
          <h3>🎮 Entertainment Videos</h3>
          <p>Coming Soon...</p>
        </div>
      </div>
    </div>

    <!-- Test Button -->
    <button id="update-academic-btn">Add 10 mins Academic (Test)</button>
  </div>
</body>
</html>
