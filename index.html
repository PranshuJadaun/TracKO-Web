<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracko Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="login-section" class="center">
    <h1>Welcome to Tracko</h1>
    <p>Track your productivity and entertainment time easily.</p>
    <button id="login-btn">Sign in with Google</button>
  </div>

  <div id="dashboard" class="hidden">
    <h1>👋 Hello, <span id="user-name"></span></h1>
    <button id="logout-btn">Logout</button>

    <div class="stats-container">
      <div class="stats-box">
        <h2>📘 Academic</h2>
        <ul id="academic-list"></ul>
      </div>
      <div class="stats-box">
        <h2>🎮 Entertainment</h2>
        <ul id="entertainment-list"></ul>
      </div>
      <button id="update-academic-btn">Add 10 mins Academic</button>
      <button id="update-entertainment-btn">Add 10 mins Entertainment</button>
    </div>
  </div>
</body>
</html>
